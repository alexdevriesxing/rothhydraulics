name: Catalogue conversion polish

on:
  push:
    paths:
      - '.github/workflows/catalogue-conversion-polish.yml'

permissions:
  contents: write

jobs:
  polish-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Polish catalogue and request flow
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import html as html_lib
          import json
          import re
          from urllib.parse import quote

          p = Path('producten.html')
          text = p.read_text(encoding='utf-8')

          if 'catalogue-polish.css' not in text:
              text = text.replace('<link rel="stylesheet" href="catalogue.css">', '<link rel="stylesheet" href="catalogue.css">\n<link rel="stylesheet" href="catalogue-polish.css">', 1)

          def clean_name(raw):
              return html_lib.unescape(re.sub(r'<[^>]+>', '', raw)).strip()

          card_matches = list(re.finditer(r'<article class="catalogue-card" id="([^"]+)"[^>]*>.*?<h3>(.*?)</h3>.*?</article>', text, re.S))
          items = []
          for index, match in enumerate(card_matches, 1):
              items.append({
                  '@type': 'ListItem',
                  'position': index,
                  'name': clean_name(match.group(2)),
                  'url': f'https://rothhydraulics.nl/producten.html#{match.group(1)}'
              })

          if 'data-catalogue-schema="true"' not in text:
              schemas = [
                  {'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[
                      {'@type':'ListItem','position':1,'name':'Home','item':'https://rothhydraulics.nl/'},
                      {'@type':'ListItem','position':2,'name':'Producten','item':'https://rothhydraulics.nl/producten.html'}
                  ]},
                  {'@context':'https://schema.org','@type':'ItemList','name':'Roth Hydraulics productcatalogus Nederland','numberOfItems':len(items),'itemListElement':items},
                  {'@context':'https://schema.org','@type':'FAQPage','mainEntity':[
                      {'@type':'Question','name':'Kan ik rechtstreeks vanuit de catalogus een Roth-uitvoering selecteren?','acceptedAnswer':{'@type':'Answer','text':'De catalogus helpt bij de voorselectie. De definitieve uitvoering wordt afgestemd op onder meer werkdruk, volume, medium, temperatuur, cycli, aansluitingen, monitoring en eventuele keuringsvereisten. Voor Nederland loopt die technische afstemming via Hobo Hydrauliek B.V.'}},
                      {'@type':'Question','name':'Kan ik meerdere Roth-producten tegelijk laten beoordelen?','acceptedAnswer':{'@type':'Answer','text':'Ja. Gebruik de shortlist op deze pagina om meerdere producten te selecteren en ze samen mee te nemen naar de technische aanvraag aan Hobo Hydrauliek.'}},
                      {'@type':'Question','name':'Zijn de productafbeeldingen extern geladen?','acceptedAnswer':{'@type':'Answer','text':'Nee. De afbeeldingen op de Nederlandse productcatalogus worden lokaal vanaf rothhydraulics.nl geladen. Als voor een specifieke optie geen afzonderlijke productfoto beschikbaar is, wordt dat als representatieve Roth-familiefoto aangeduid.'}},
                      {'@type':'Question','name':'Wie verzorgt Roth Hydraulics aanvragen in Nederland?','acceptedAnswer':{'@type':'Answer','text':'Hobo Hydrauliek B.V. verzorgt de Nederlandse distributie, productselectie, technische afstemming en offertebegeleiding voor Roth Hydraulics.'}}
                  ]}
              ]
              schema_html = ''.join('<script type="application/ld+json" data-catalogue-schema="true">'+json.dumps(s,ensure_ascii=False,separators=(',',':'))+'</script>\n' for s in schemas)
              text = text.replace('</head>', schema_html + '</head>', 1)

          text = text.replace('id="catalogue-search" type="search"', 'id="catalogue-search" type="search" aria-label="Doorzoek de Roth Hydraulics productcatalogus" enterkeyhint="search"', 1)

          def transform_card(match):
              block = match.group(0)
              heading = re.search(r'<h3>(.*?)</h3>', block, re.S)
              if not heading:
                  return block
              name = clean_name(heading.group(1))
              block = re.sub(r'<img(?![^>]*\bdecoding=)', '<img decoding="async"', block, count=1)
              if 'catalogue-actions-row' not in block:
                  encoded = quote(name, safe='')
                  replacement = (
                      '<div class="catalogue-actions-row">'
                      f'<a class="card-link" href="contact.html?product={encoded}">Selectie / offerte →</a>'
                      f'<button class="catalogue-shortlist" type="button" data-product="{html_lib.escape(name, quote=True)}" aria-pressed="false" aria-label="{html_lib.escape(name, quote=True)} toevoegen aan technische aanvraag">Bewaar voor aanvraag</button>'
                      '</div>'
                  )
                  block = re.sub(r'<a class="card-link" href="contact\.html">.*?</a>', replacement, block, count=1, flags=re.S)
              return block

          text = re.sub(r'<article class="catalogue-card" id="[^"]+"[^>]*>.*?</article>', transform_card, text, flags=re.S)

          if 'catalogue-shortlist-help' not in text:
              text = re.sub(
                  r'(<div class="catalogue-status" id="catalogue-status" aria-live="polite">.*?</div>)',
                  r'\1<span class="catalogue-shortlist-help" id="catalogue-shortlist-help">Selecteer producten om één gecombineerde technische aanvraag te maken.</span>',
                  text, count=1, flags=re.S
              )

          if 'id="catalogus-hulp"' not in text:
              faq = '''
          <section class="section section-soft catalogue-help" id="catalogus-hulp">
            <div class="container">
              <div class="catalogue-section-head">
                <div><div class="catalogue-count">Praktische hulp</div><h2>Van productlijst naar technische selectie.</h2></div>
                <p>Gebruik de catalogus om mogelijke Roth-oplossingen te verzamelen. Hobo Hydrauliek kan daarna de uitvoering op de werkgegevens afstemmen.</p>
              </div>
              <div class="catalogue-faq-grid">
                <details open><summary>Kan ik rechtstreeks vanuit de catalogus een uitvoering kiezen?</summary><p>Gebruik de catalogus voor de voorselectie. De definitieve uitvoering hangt af van onder meer werkdruk, volume, medium, temperatuur, cycli, aansluitingen, monitoring en eventuele keuringsvereisten.</p></details>
                <details><summary>Kan ik meerdere producten tegelijk laten beoordelen?</summary><p>Ja. Kies op de productkaarten <strong>Bewaar voor aanvraag</strong>. Uw selectie blijft in deze browser bewaard en kan als één aanvraag naar Hobo Hydrauliek worden meegenomen.</p></details>
                <details><summary>Waarom staat bij sommige afbeeldingen “representatief”?</summary><p>Niet iedere publiek benoemde optie heeft een afzonderlijke productfoto. In dat geval toont de catalogus bewust een lokaal opgeslagen officiële Roth-familiefoto en wordt die als representatief aangeduid.</p></details>
                <details><summary>Waar komt mijn aanvraag terecht?</summary><p>De technische aanvraag wordt als e-mail aan Hobo Hydrauliek B.V. in Emmen voorbereid. U kunt vóór verzending zelf nog aanvullende werkgegevens en opmerkingen toevoegen.</p></details>
              </div>
            </div>
          </section>
          '''
              text = text.replace('</main>', faq + '</main>', 1)

          if 'id="catalogue-shortlist-bar"' not in text:
              bar = '''
          <div class="catalogue-shortlist-bar" id="catalogue-shortlist-bar" hidden aria-live="polite">
            <div class="container catalogue-shortlist-inner">
              <div class="catalogue-shortlist-copy"><strong id="catalogue-shortlist-count">0 producten geselecteerd</strong><span id="catalogue-shortlist-preview">Maak één gecombineerde aanvraag voor Hobo Hydrauliek.</span></div>
              <div class="catalogue-shortlist-actions"><button type="button" class="btn btn-secondary" id="catalogue-shortlist-clear">Wis selectie</button><a class="btn btn-primary" id="catalogue-shortlist-request" href="contact.html?shortlist=1">Aanvraag met selectie →</a></div>
            </div>
          </div>
          '''
              text = text.replace('</main>', '</main>\n' + bar, 1)

          p.write_text(text, encoding='utf-8')

          c = Path('contact.html')
          contact = c.read_text(encoding='utf-8')
          if 'contact-polish.css' not in contact:
              contact = contact.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="contact-polish.css">', 1)
          field = re.compile(r'<div class="field full"><label for="product">Product / toepassing</label><select id="product" name="product">.*?</select></div>', re.S)
          replacement = '<div class="field full"><label for="product">Product / toepassing</label><textarea id="product" name="product" rows="2" placeholder="Bijv. membraanaccumulator, N₂-laadunit of meerdere producten uit de catalogus"></textarea><div class="field-help" id="catalogue-selection-status">U kunt één product invullen of meerdere producten vanuit de catalogus meenemen.</div></div>'
          contact = field.sub(replacement, contact, count=1)
          contact = contact.replace('producten.html#membraan"', 'producten.html#membraanaccumulatoren"')
          contact = contact.replace('producten.html#blaas"', 'producten.html#blaasaccumulatoren"')
          contact = contact.replace('producten.html#zuiger"', 'producten.html#zuigeraccumulatoren"')
          c.write_text(contact, encoding='utf-8')
          PY

          cat > catalogue-polish.css <<'EOF'
          /* Catalogue conversion, accessibility and responsive polish */
          .catalogue-section,.catalogue-card[id],#catalogus-hulp{scroll-margin-top:168px}
          .catalogue-search input::placeholder{color:#8a9199}.catalogue-search input::-webkit-search-cancel-button{cursor:pointer}
          .catalogue-filters{scroll-snap-type:x proximity;overscroll-behavior-inline:contain}
          .catalogue-filter{scroll-snap-align:start;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
          .catalogue-filter:hover{transform:translateY(-1px)}
          .catalogue-filter:focus-visible,.catalogue-shortlist:focus-visible,.catalogue-faq-grid summary:focus-visible{outline:3px solid rgba(207,16,26,.22);outline-offset:3px}
          .catalogue-shortlist-help{display:block;margin-top:3px;color:#7a8189;font-size:11px}
          .catalogue-card{position:relative}.catalogue-card .catalogue-media img{transition:transform .35s ease,filter .35s ease}.catalogue-card:hover .catalogue-media img{transform:scale(1.025)}.catalogue-card:focus-within{border-color:#c7ccd1;box-shadow:var(--shadow-sm)}
          .catalogue-actions-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:18px}.catalogue-actions-row .card-link{margin-top:0;min-height:40px;display:inline-flex;align-items:center}
          .catalogue-shortlist{min-height:40px;border:1px solid #d9dde1;background:#fff;color:#3c4249;border-radius:9px;padding:0 11px;font-size:11px;font-weight:800;cursor:pointer;transition:.18s ease;white-space:nowrap}.catalogue-shortlist:hover{border-color:#bfc5cb;background:#f8f9fa}.catalogue-shortlist.selected{background:#17191d;color:#fff;border-color:#17191d}
          .catalogue-help{border-top:1px solid var(--line)}.catalogue-faq-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.catalogue-faq-grid details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 20px;box-shadow:0 8px 24px rgba(16,22,28,.045)}.catalogue-faq-grid summary{list-style:none;cursor:pointer;font-weight:800;line-height:1.35;padding:20px 34px 20px 0;position:relative}.catalogue-faq-grid summary::-webkit-details-marker{display:none}.catalogue-faq-grid summary::after{content:'+';position:absolute;right:0;top:18px;font-size:22px;color:var(--roth);font-weight:500;line-height:1}.catalogue-faq-grid details[open] summary::after{content:'−'}.catalogue-faq-grid details p{margin:0;padding:0 0 20px;color:var(--muted);font-size:14px}
          .catalogue-shortlist-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(18,20,24,.97);color:#fff;border-top:1px solid rgba(255,255,255,.12);box-shadow:0 -18px 50px rgba(12,15,18,.22);backdrop-filter:blur(18px)}.catalogue-shortlist-bar[hidden]{display:none}.catalogue-shortlist-inner{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:28px;padding-top:13px;padding-bottom:13px}.catalogue-shortlist-copy{min-width:0}.catalogue-shortlist-copy strong{display:block;font-size:15px}.catalogue-shortlist-copy span{display:block;color:#b8bec5;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:700px}.catalogue-shortlist-actions{display:flex;gap:10px;flex:0 0 auto}.catalogue-shortlist-bar .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.24)}.catalogue-shortlist-bar .btn-secondary:hover{border-color:rgba(255,255,255,.5)}body.has-catalogue-shortlist{padding-bottom:88px}
          @media(max-width:980px){.catalogue-section,.catalogue-card[id],#catalogus-hulp{scroll-margin-top:150px}.catalogue-actions-row{grid-template-columns:1fr}.catalogue-shortlist{width:100%}.catalogue-shortlist-copy span{max-width:420px}}
          @media(max-width:680px){.catalogue-section,.catalogue-card[id],#catalogus-hulp{scroll-margin-top:92px}.catalogue-faq-grid{grid-template-columns:1fr}.catalogue-shortlist-inner{align-items:stretch;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:12px}.catalogue-shortlist-copy span{max-width:100%}.catalogue-shortlist-actions{display:grid;grid-template-columns:.82fr 1.18fr;width:100%}.catalogue-shortlist-actions .btn{min-height:46px;padding:0 12px;font-size:12px}body.has-catalogue-shortlist{padding-bottom:142px}}
          @media(prefers-reduced-motion:reduce){.catalogue-filter,.catalogue-card,.catalogue-card .catalogue-media img,.catalogue-shortlist{transition:none!important}.catalogue-card:hover,.catalogue-filter:hover{transform:none!important}}
          EOF

          cat > contact-polish.css <<'EOF'
          .field-help{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.45}#product{min-height:78px}#product.prefilled{border-color:rgba(207,16,26,.45);background:#fffafa;box-shadow:0 0 0 3px rgba(207,16,26,.06)}
          EOF

          cat > catalogue.js <<'EOF'
          (() => {
            const storageKey='rothCatalogueShortlist';
            const search=document.querySelector('#catalogue-search');
            const filterButtons=[...document.querySelectorAll('.catalogue-filter')];
            const cards=[...document.querySelectorAll('.catalogue-card')];
            const sections=[...document.querySelectorAll('.catalogue-section')];
            const status=document.querySelector('#catalogue-status');
            const noResults=document.querySelector('#catalogue-no-results');
            const shortlistButtons=[...document.querySelectorAll('.catalogue-shortlist')];
            const shortlistBar=document.querySelector('#catalogue-shortlist-bar');
            const shortlistCount=document.querySelector('#catalogue-shortlist-count');
            const shortlistPreview=document.querySelector('#catalogue-shortlist-preview');
            const shortlistClear=document.querySelector('#catalogue-shortlist-clear');
            const shortlistRequest=document.querySelector('#catalogue-shortlist-request');
            let activeCategory='all';
            document.querySelectorAll('img[data-fallback]').forEach(img=>img.addEventListener('error',()=>{const fallback=img.dataset.fallback;if(fallback&&img.getAttribute('src')!==fallback)img.setAttribute('src',fallback)},{once:true}));
            const normalize=value=>(value||'').toLocaleLowerCase('nl-NL').normalize('NFD').replace(/\p{Diacritic}/gu,'');
            function applyFilters(){const query=normalize(search?.value);let visible=0;cards.forEach(card=>{const categoryMatch=activeCategory==='all'||card.dataset.category===activeCategory;const textMatch=!query||normalize(card.dataset.search).includes(query);const show=categoryMatch&&textMatch;card.hidden=!show;if(show)visible+=1});sections.forEach(section=>{const sectionCards=[...section.querySelectorAll('.catalogue-card')];section.hidden=sectionCards.length>0&&sectionCards.every(card=>card.hidden)});filterButtons.forEach(button=>{const pressed=button.dataset.filter===activeCategory;button.classList.toggle('active',pressed);button.setAttribute('aria-pressed',String(pressed))});if(status)status.textContent=`${visible} van ${cards.length} benoemde producten, opties en oplossingen zichtbaar`;if(noResults)noResults.classList.toggle('show',visible===0)}
            filterButtons.forEach(button=>{button.setAttribute('aria-pressed',String(button.classList.contains('active')));button.addEventListener('click',()=>{activeCategory=button.dataset.filter||'all';applyFilters()})});
            search?.addEventListener('input',applyFilters);search?.addEventListener('keydown',event=>{if(event.key==='Escape'&&search.value){search.value='';applyFilters();search.focus()}});
            function loadShortlist(){try{const parsed=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(parsed)?parsed.filter(item=>typeof item==='string'):[]}catch{return[]}}
            let shortlist=loadShortlist();
            function saveShortlist(){try{localStorage.setItem(storageKey,JSON.stringify(shortlist))}catch{}}
            function renderShortlist(){const set=new Set(shortlist);shortlistButtons.forEach(button=>{const selected=set.has(button.dataset.product);button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected));button.textContent=selected?'Op aanvraaglijst ✓':'Bewaar voor aanvraag'});const count=shortlist.length;if(shortlistBar)shortlistBar.hidden=count===0;document.body.classList.toggle('has-catalogue-shortlist',count>0);if(shortlistCount)shortlistCount.textContent=count===1?'1 product geselecteerd':`${count} producten geselecteerd`;if(shortlistPreview){if(!count)shortlistPreview.textContent='Maak één gecombineerde aanvraag voor Hobo Hydrauliek.';else{const shown=shortlist.slice(0,3).join(' · ');const remaining=count-3;shortlistPreview.textContent=remaining>0?`${shown} · +${remaining} meer`:shown}}if(shortlistRequest)shortlistRequest.href='contact.html?shortlist=1'}
            shortlistButtons.forEach(button=>button.addEventListener('click',()=>{const product=button.dataset.product;if(!product)return;const exists=shortlist.includes(product);shortlist=exists?shortlist.filter(item=>item!==product):[...shortlist,product];saveShortlist();renderShortlist()}));
            shortlistClear?.addEventListener('click',()=>{shortlist=[];saveShortlist();renderShortlist()});
            document.querySelectorAll('.catalogue-faq-grid details').forEach(details=>details.addEventListener('toggle',()=>{if(!details.open)return;document.querySelectorAll('.catalogue-faq-grid details').forEach(other=>{if(other!==details)other.open=false})}));
            applyFilters();renderShortlist();
          })();
          EOF

          cat > script.js <<'EOF'
          const mobileToggle=document.querySelector('.mobile-toggle');const mobileMenu=document.querySelector('.mobile-menu');if(mobileToggle&&mobileMenu){mobileToggle.addEventListener('click',()=>{const open=mobileMenu.classList.toggle('open');mobileToggle.setAttribute('aria-expanded',String(open))});mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobileMenu.classList.remove('open');mobileToggle.setAttribute('aria-expanded','false')}))}
          const observer='IntersectionObserver'in window?new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');observer.unobserve(entry.target)}})},{threshold:.12}):null;document.querySelectorAll('.reveal').forEach(el=>{if(observer)observer.observe(el);else el.classList.add('in')});
          const appType=document.querySelector('#app-type'),pressure=document.querySelector('#pressure'),volume=document.querySelector('#volume'),selectorResult=document.querySelector('#selector-result');function adviseAccumulator(){if(!selectorResult||!appType||!pressure||!volume)return;const p=Number(pressure.value||0),v=Number(volume.value||0),app=appType.value;let title='Startpunt: technische selectie door Hobo Hydrauliek',text='Vul toepassing, werkdruk en benodigd volume in voor een eerste richting. Definitieve selectie gebeurt op basis van alle bedrijfscondities.';if(p||v||app){if(p>690||v>57||app==='grote-energie'){title='Waarschijnlijke richting: zuigeraccumulator of accumulatorsysteem';text='Geschikt als hoge druk, groot bruikbaar volume of een klantspecifiek systeem centraal staat. Hobo Hydrauliek kan de werkgegevens met u nalopen.'}else if(v>3.5||app==='energie'||app==='nood'){title='Waarschijnlijke richting: blaasaccumulator';text='Een veelgebruikte keuze voor energieopslag en snelle drukrespons. Materiaal, medium, temperatuur en cycli bepalen de uiteindelijke uitvoering.'}else{title='Waarschijnlijke richting: membraanaccumulator';text='Compact en onderhoudsarm voor kleinere volumes, pulsatie- en drukdemping. Laat Hobo Hydrauliek de exacte uitvoering verifiëren.'}}selectorResult.querySelector('strong').textContent=title;selectorResult.querySelector('span').textContent=text}[appType,pressure,volume].filter(Boolean).forEach(el=>el.addEventListener('input',adviseAccumulator));
          const contactForm=document.querySelector('#contact-form');if(contactForm){const params=new URLSearchParams(window.location.search);const productField=contactForm.querySelector('#product');const messageField=contactForm.querySelector('#bericht');const selectionStatus=document.querySelector('#catalogue-selection-status');const directProduct=params.get('product');let selectedProducts=[];if(params.get('shortlist')==='1'){try{const parsed=JSON.parse(localStorage.getItem('rothCatalogueShortlist')||'[]');if(Array.isArray(parsed))selectedProducts=parsed.filter(item=>typeof item==='string')}catch{selectedProducts=[]}}if(directProduct)selectedProducts=[directProduct];if(productField&&selectedProducts.length){productField.value=selectedProducts.join('; ');productField.classList.add('prefilled');if(selectionStatus)selectionStatus.textContent=selectedProducts.length===1?'Dit product is automatisch vanuit de catalogus ingevuld.':`${selectedProducts.length} producten zijn automatisch vanuit uw catalogusselectie ingevuld.`;if(messageField&&!messageField.value)messageField.placeholder='Vul hier de werkgegevens aan: functie, min./max. druk, benodigd volume, medium, temperatuur, cycli en eventuele keurings- of omgevingsvereisten.'}contactForm.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(contactForm);const subject=`Roth Hydraulics aanvraag – ${data.get('bedrijf')||data.get('naam')||'website'}`;const body=[`Naam: ${data.get('naam')||''}`,`Bedrijf: ${data.get('bedrijf')||''}`,`E-mail: ${data.get('email')||''}`,`Telefoon: ${data.get('telefoon')||''}`,`Product / toepassing: ${data.get('product')||''}`,'',`${data.get('bericht')||''}`].join('\n');window.location.href=`mailto:info@hobohydrauliek.nl?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;const status=contactForm.querySelector('.form-status');if(status)status.textContent='Uw e-mailprogramma wordt geopend met de aanvraag voor Hobo Hydrauliek.'})}
          EOF

      - name: Validate catalogue pass
        shell: bash
        run: |
          set -euo pipefail
          node --check catalogue.js
          node --check script.js
          python <<'PY'
          from pathlib import Path
          import re
          product=Path('producten.html').read_text(encoding='utf-8')
          contact=Path('contact.html').read_text(encoding='utf-8')
          assert len(re.findall(r'class="catalogue-card"',product)) == 46
          assert len(re.findall(r'class="catalogue-shortlist"',product)) == 46
          assert product.count('<h1') == 1
          assert 'catalogue-shortlist-bar' in product
          assert 'catalogus-hulp' in product
          assert product.count('data-catalogue-schema="true"') == 3
          assert not re.search(r'<img[^>]+src="https?://',product)
          assert 'contact-polish.css' in contact
          assert '<textarea id="product"' in contact
          print('QA OK: 46 cards, 46 shortlist controls, 3 structured-data blocks, local images only, contact prefill ready.')
          PY

      - name: Commit polished catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalogue-conversion-polish.yml
          git add producten.html catalogue.js catalogue-polish.css contact.html contact-polish.css script.js
          git commit -m 'Polish complete Roth catalogue conversion and request flow'
          git push
