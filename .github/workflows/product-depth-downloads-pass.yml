name: Product depth and downloads pass

on:
  push:
    paths:
      - '.github/workflows/product-depth-downloads-pass.yml'
      - '.github/scripts/product_depth_pass.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapt pass script to current minified catalogue JS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/product_depth_pass.py')
          s=p.read_text(encoding='utf-8')
          old="marker = '  applyFilters();renderShortlist();\\n})();'"
          new="marker = 'applyFilters();render()})();'"
          if old not in s:
              raise SystemExit('Expected source marker not found in pass script')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Apply product depth pass
        run: python .github/scripts/product_depth_pass.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check catalogue.js
          node --check script.js
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          product=Path('producten.html').read_text(encoding='utf-8')
          downloads=Path('downloads.html').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          assert len(re.findall(r'class="catalogue-card',product))==46
          assert product.count('class="catalogue-shortlist"')==46
          assert 'catalogue-compare-dialog' in product and 'id="catalogue-compare"' in product
          assert 'catalogue-resource-rail' in product
          assert 'relatedByCategory' in Path('catalogue.js').read_text(encoding='utf-8')
          assert downloads.count('<h1')==1
          assert downloads.count('target="_blank"')>=8
          assert 'roth-hydraulics.de' in downloads
          assert 'catalogue-home-bridge' in index
          assert 'downloads.html' in Path('sitemap.xml').read_text(encoding='utf-8')
          assert not re.search(r'<img[^>]+src="https?://',product)
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      href=dict(attrs).get('href')
                      if href: self.hrefs.append(href)
          broken=[]
          for page in Path('.').glob('*.html'):
              parser=Parser(); parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.hrefs:
                  if href.startswith(('http://','https://','mailto:','tel:','#')): continue
                  target=href.split('#',1)[0].split('?',1)[0]
                  if target and not Path(target).exists(): broken.append((page.name,href))
          assert not broken, broken
          print('QA OK: comparison, related-product UX, official downloads, sitemap and local links.')
          PY
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/product-depth-downloads-pass.yml .github/scripts/product_depth_pass.py
          git add -A
          git commit -m 'Add Roth product comparison, related products and official download hub'
          git push
